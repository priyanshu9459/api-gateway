spring:
  application:
    name: Api-Gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: after_route
              uri: lb://userservice
              predicates:
                - Path=/users/**
            - id: after_route
              uri: lb://hospital-mangement
              predicates:
                - Path=/public/**,/doctors/**


server:
  port: 8084





eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
